map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Same routing as nginx.conf, so the app keeps a single origin (cookie auth, relative URLs)
    location /api/ {
        proxy_pass http://backendserver:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SignalR hub only (negotiate + websocket), not the /lobby/{id} Blazor page
    location ~ ^/lobby(/negotiate)?$ {
        proxy_pass http://backendserver:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Blazor dev server, including the hot reload websocket
    location / {
        proxy_pass http://frontend:5232;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
    }
}
